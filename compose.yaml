# Local:  docker compose up --build            → the app on http://localhost:8787
# Server: COMPOSE_PROFILES=tunnel (set in .env) → also starts cloudflared, which publishes the app over
#         HTTPS through Cloudflare Tunnel. The server opens no inbound port.

services:
  app:
    build: .
    image: stellar-logo-agent:local
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - data:/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env (terraform output tunnel_token)}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
