# Local container run: docker compose up --build → http://localhost:8787
# The server uses infra/server/compose.yaml instead (the image CI publishes, plus Cloudflare Tunnel).

services:
  app:
    build:
      context: .
      args:
        APP_VERSION: local
    image: stellar-logo-agent:local
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
