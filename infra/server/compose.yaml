# Production compose, installed on the server at /opt/logo-agent by Terraform.
# The app runs the image CI publishes; logo-agent-update.timer pulls new versions of IMAGE:APP_TAG.
# cloudflared publishes it over HTTPS through Cloudflare Tunnel: the server opens no inbound port.
#
# Two files, so each container sees only its own secrets:
#   .env      IMAGE, APP_TAG, TUNNEL_TOKEN (read by compose for ${...}; never passed to the app)
#   app.env   the app's settings and API keys

services:
  app:
    image: ${IMAGE:?set IMAGE in .env}:${APP_TAG:-main}
    env_file: app.env
    environment:
      DATA_DIR: /data
      PORT: "8787"
    volumes:
      - data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  data:
