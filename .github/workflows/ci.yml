# CI: tests, an offline render, the infrastructure code and the image build.
# Runs on pull requests and branch pushes, and as the first stage of CD (cd.yml calls it).
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: typecheck, tests, render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # The kit comes from vendor/ (packed tarballs pinned by KIT_REF): no clone, no build.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Render logos offline (heuristic designer, no keys)
        run: |
          npm run demo -- https://github.com/berkingurcan/stellar-agent-search geometric 3 \
            --digest test/fixtures/digest-stellar-agent-search.json
          test -n "$(find out -name presentation.pdf)"
          test "$(find out -name 'logo-*.svg' | wc -l)" -ge 9
      - uses: actions/upload-artifact@v4
        with:
          name: sample-logos
          path: out/
          retention-days: 7

  infra:
    name: terraform and server scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check -recursive -diff
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - run: shellcheck infra/server/update.sh scripts/vendor-kit.sh

  docker:
    name: image builds
    # CD builds and pushes the multi-arch image itself; here, check the Dockerfile on pull requests and branches.
    if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
